[project]
name = "agentplatform-core"
version = "0.1.0"
description = "Agent Platform — core gRPC service"
requires-python = ">=3.12"
dependencies = [
    "grpcio==1.64.1",
    "grpcio-tools==1.64.1",
    "sqlalchemy[asyncio]==2.0.31",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "structlog==24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "generated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
