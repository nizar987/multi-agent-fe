syntax = "proto3";

package agentplatform.v1;

import "agentplatform/v1/common.proto";

option py_generic_services = false;

service SkillService {
  rpc ListSkills   (ListSkillsRequest)   returns (ListSkillsResponse);
  rpc GetSkill     (GetSkillRequest)     returns (Skill);
  rpc CreateSkill  (CreateSkillRequest)  returns (Skill);
  rpc UpdateSkill  (UpdateSkillRequest)  returns (Skill);
  rpc DeleteSkill  (DeleteSkillRequest)  returns (Empty);
}

message Skill {
  int64  id          = 1;
  string name        = 2;
  string description = 3;
  string content     = 4;
  string created_at  = 5;
}

message ListSkillsRequest  { PageRequest page = 1; }
message ListSkillsResponse {
  repeated Skill skills = 1;
  PageMeta meta         = 2;
}

message GetSkillRequest    { int64 id = 1; }

message CreateSkillRequest {
  string name        = 1;
  string description = 2;
  string content     = 3;
}

message UpdateSkillRequest {
  int64  id          = 1;
  string name        = 2;
  string description = 3;
  string content     = 4;
}

message DeleteSkillRequest { int64 id = 1; }
