[project]
name = "agentplatform-gateway"
version = "0.1.0"
description = "Agent Platform — REST/SSE gateway (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "grpcio==1.64.1",
    "grpcio-tools==1.64.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "structlog==24.2.0",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "generated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
