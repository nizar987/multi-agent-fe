version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentplatform}
      POSTGRES_DB: ${POSTGRES_DB:-agentplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentplatform}:${POSTGRES_PASSWORD:-agentplatform}@postgres:5432/${POSTGRES_DB:-agentplatform}
      CORE_HOST: 0.0.0.0
      CORE_PORT: 50051
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CORE_HOST: core
      CORE_PORT: 50051
      GATEWAY_SECRET: ${GATEWAY_SECRET:-changeme-dev-secret}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
